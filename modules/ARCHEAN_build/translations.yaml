    zh_CN: "\t瞄准现有仪表板并按 %s。"

  - en_US: "The element can be placed anywhere on a dashboard with a precision of 1cm."
    fr_FR: "L'élément peut être placé n'importe où sur un tableau de bord avec une précision de 1 cm."
    es_ES: "El elemento puede colocarse en cualquier lugar de un tablero con una precisión de 1 cm."
    de_DE: "Das Element kann überall auf einem Dashboard mit einer Genauigkeit von 1 cm platziert werden."
    it_IT: "L'elemento può essere posizionato ovunque su un dashboard con una precisione di 1 cm."
    ru_RU: "Элемент можно разместить в любом месте на панели инструментов с точностью 1 см."
    zh_CN: "该元素可以以1厘米的精度放置在仪表板的任何位置。"

  - en_US: "To add a cable or pipe, aim at a source component's connector and quick press %s."
    fr_FR: "Pour ajouter un câble ou un tuyau, visez le connecteur d'un composant source et appuyez sur %s."
    es_ES: "Para añadir un cable o una tubería, apunte al conector de un componente fuente y presione %s."
    de_DE: "Um ein Kabel oder eine Rohrleitung hinzuzufügen, zielen Sie auf den Anschluss eines Quellkomponenten und drücken Sie %s."
    it_IT: "Per aggiungere un cavo o un tubo, mira al connettore di un componente sorgente e premi %s."
    ru_RU: "Чтобы добавить кабель или трубу, прицелитесь на разъем источника и быстро нажмите %s."
    zh_CN: "要添加电缆或管道，请瞄准源组件的连接器并快速按 %s。"

  - en_US: "You can snap the cable on blocks by pressing %s, or on a component surfaces by pressing SHIFT and %s."
    fr_FR: "Vous pouvez fixer le câble sur des blocs en appuyant sur %s, ou sur les surfaces d'un composant en appuyant sur SHIFT et %s."
    es_ES: "Puedes fijar el cable en bloques presionando %s, o en las superficies de un componente presionando SHIFT y %s."
    de_DE: "Sie können das Kabel auf Blöcken befestigen, indem Sie %s drücken, oder auf den Oberflächen eines Komponenten, indem Sie SHIFT und %s drücken."
    it_IT: "Puoi fissare il cavo sui blocchi premendo %s, o sulle superfici di un componente premendo SHIFT e %s."
    ru_RU: "Вы можете зафиксировать кабель на блоках, нажав %s, или на поверхностях компонента, нажав SHIFT и %s."
    zh_CN: "您可以通过按 %s 在块上固定电缆，或通过按 SHIFT 和 %s 在组件表面上固定电缆。"

  - en_US: "You may add as many segments as you want until you reach the maximum length (remaining in your spool)."
    fr_FR: "Vous pouvez ajouter autant de segments que vous le souhaitez jusqu'à atteindre la longueur maximale (restante dans votre bobine)."
    es_ES: "Puedes añadir tantos segmentos como desees hasta alcanzar la longitud máxima (restante en tu bobina)."
    de_DE: "Sie können so viele Segmente hinzufügen, wie Sie möchten, bis Sie die maximale Länge (verbleibend in Ihrer Spule) erreichen."
    it_IT: "Puoi aggiungere quanti più segmenti desideri fino a raggiungere la lunghezza massima (rimasta nella tua bobina)."
    ru_RU: "Вы можете добавить столько сегментов, сколько хотите, пока не достигнете максимальной длины (оставшейся в вашей катушке)."
    zh_CN: "您可以添加任意数量的段，直到达到最大长度（剩余在您的卷轴中）。"

  - en_US: "You can remove the last segment by pressing %s"
    fr_FR: "Vous pouvez supprimer le dernier segment en appuyant sur %s"
    es_ES: "Puedes eliminar el último segmento presionando %s"
    de_DE: "Sie können das letzte Segment entfernen, indem Sie %s drücken"
    it_IT: "Puoi rimuovere l'ultimo segmento premendo %s"
    ru_RU: "Вы можете удалить последний сегмент, нажав %s"
    zh_CN: "您可以通过按 %s 删除最后一个段落"

  - en_US: "To finalize the cable, aim at a destination component's connector and quick press %s."
    fr_FR: "Pour finaliser le câble, visez le connecteur d'un composant de destination et appuyez sur %s."
    es_ES: "Para finalizar el cable, apunte al conector de un componente de destino y presione %s."
    de_DE: "Um das Kabel zu finalisieren, zielen Sie auf den Anschluss eines Zielkomponenten und drücken Sie %s."
    it_IT: "Per finalizzare il cavo, mira al connettore di un componente di destinazione e premi %s."
    ru_RU: "Чтобы завершить кабель, прицелитесь на разъем целевого компонента и быстро нажмите %s."
    zh_CN: "要完成电缆，请瞄准目标组件的连接器并快速按 %s。"

  - en_US: "You can remove an entire finished cable by aiming at it and holding %s then quick press %s"
    fr_FR: "Vous pouvez supprimer un câble terminé en visant et en maintenant %s, puis en appuyant sur %s"
    es_ES: "Puedes eliminar un cable terminado apuntando a él y manteniendo %s, luego presionando %s"
    de_DE: "Sie können ein fertiges Kabel entfernen, indem Sie darauf zielen und %s halten, dann %s drücken"
    it_IT: "Puoi rimuovere un cavo finito mirandolo e tenendo premuto %s, poi premendo %s"
    ru_RU: "Вы можете удалить готовый кабель, прицелившись на него и удерживая %s, затем нажав %s"
    zh_CN: "您可以通过瞄准已完成的电缆并按住 %s，然后快速按 %s 来删除整个电缆。"

  - en_US: "When snapping the cable on blocks or components, you can hold %s to snap on the interior face"
    fr_FR: "Lorsque vous fixez le câble sur des blocs ou des composants, vous pouvez maintenir %s pour vous fixer sur la face intérieure"
    es_ES: "Cuando se fija el cable en bloques o componentes, puede mantener %s para fijarlo en la cara interior"
    de_DE: "Wenn Sie das Kabel auf Blöcken oder Komponenten befestigen, können Sie %s halten, um es auf der Innenseite zu befestigen"
    it_IT: "Quando si fissa il cavo su blocchi o componenti, è possibile tenere premuto %s per fissarlo sulla faccia interna"
    ru_RU: "Когда вы фиксируете кабель на блоках или компонентах, вы можете удерживать %s, чтобы зафиксировать его на внутренней стороне"
    zh_CN: "当您在块或组件上固定电缆时，可以按住 %s 以固定在内部面上"

