translations:

  - en_US: "Open Blueprints Folder"
    fr_FR: "ouvrir le dossier des plans"
    es_ES: "Abrir carpeta de planos"
    de_DE: "Blueprints-Ordner öffnen"
    it_IT: "Apri cartella dei piani"
    ru_RU: "Открыть папку чертежей"
    zh_CN: "打开蓝图文件夹"

  - en_US: "Delete"
    fr_FR: "Supprimer"
    es_ES: "Eliminar"
    de_DE: "Löschen"
    it_IT: "Elimina"
    ru_RU: "Удалить"
    zh_CN: "删除"

  - en_US: "To spawn the blueprint press and hold %s for two seconds."
    fr_FR: "Pour faire apparaître le plan, appuyez et maintenez %s pendant deux secondes."
    es_ES: "Para generar el plano, mantén presionado %s durante dos segundos."
    de_DE: "Um den Plan zu erstellen, halten Sie %s zwei Sekunden lang gedrückt."
    it_IT: "Per generare il piano, tieni premuto %s per due secondi."
    ru_RU: "Чтобы создать чертеж, удерживайте %s в течение двух секунд."
    zh_CN: "要生成蓝图，请按住 %s 两秒钟。"

  - en_US: "You may also spawn the blueprint on top of an existing build to add the parts to it by quickly pressing %s before making finer adjustments."
    fr_FR: "Vous pouvez également faire apparaître le plan sur une construction existante en appuyant sur %s avant de faire des ajustements plus fins."
    es_ES: "También puedes generar el plano sobre una construcción existente presionando rápidamente %s antes de hacer ajustes más finos."
    de_DE: "Sie können den Plan auch über eine vorhandene Konstruktion erstellen, indem Sie %s schnell drücken, bevor Sie feinere Anpassungen vornehmen."
    it_IT: "Puoi anche generare il piano su una costruzione esistente premendo rapidamente %s prima di apportare ulteriori modifiche."
    ru_RU: "Вы также можете создать чертеж поверх существующей конструкции, быстро нажав %s перед внесением более тонких настроек."
    zh_CN: "您还可以在现有构建上生成蓝图，通过快速按下 %s 来添加零件，然后进行更精细的调整。"

  - en_US: "Rotate/Move the blueprint until it fits like you want it then press and hold %s for two seconds to spawn it permanently."
    fr_FR: "Faire pivoter/Déplacer le plan jusqu'à ce qu'il s'adapte comme vous le souhaitez, puis appuyez et maintenez %s pendant deux secondes pour le faire apparaître définitivement."
    es_ES: "Gira/Mueve el plano hasta que se ajuste como lo deseas y luego mantén presionado %s durante dos segundos para generarlo permanentemente."
    de_DE: "Drehen/Bewegen Sie den Plan, bis er passt, wie Sie es möchten, und halten Sie dann %s zwei Sekunden lang gedrückt, um ihn dauerhaft zu erstellen."
    it_IT: "Ruota/Muovi il piano fino a quando non si adatta come desideri, quindi tieni premuto %s per due secondi per generarlo permanentemente."
    ru_RU: "Поверните/переместите чертеж, пока он не подойдет так, как вам нужно, затем удерживайте %s в течение двух секунд, чтобы создать его навсегда."
    zh_CN: "旋转/移动蓝图，直到它符合您的要求，然后按住 %s 两秒钟以永久生成它。"

  - en_US: "To cancel the spawn of this blueprint press %s."
    fr_FR: "Pour annuler l'apparition de ce plan, appuyez sur %s."
    es_ES: "Para cancelar la generación de este plano, presiona %s."
    de_DE: "Um die Erstellung dieses Plans abzubrechen, drücken Sie %s."
    it_IT: "Per annullare la generazione di questo piano, premi %s."
    ru_RU: "Чтобы отменить создание этого чертежа, нажмите %s."
    zh_CN: "要取消生成此蓝图，请按 %s。"

  - en_US: "ROTATE with MouseWheel (while holding SHIFT to change base axis), press %s to change mode"
    fr_FR: "FAIRE PIVOTER avec la molette de la souris (en maintenant SHIFT pour changer l'axe de base), appuyez sur %s pour changer de mode"
    es_ES: "ROTAR con la rueda del ratón (manteniendo SHIFT para cambiar el eje base), presiona %s para cambiar de modo"
    de_DE: "Drehen mit der Maus (bei gedrücktem SHIFT, um die Basisachse zu ändern), drücken Sie %s, um den Modus zu ändern"
    it_IT: "Ruota con la rotella del mouse (tenendo premuto SHIFT per cambiare l'asse di base), premi %s per cambiare modalità"
    ru_RU: "Поверните с помощью колесика мыши (удерживая SHIFT для изменения базовой оси), нажмите %s для изменения режима"
    zh_CN: "使用鼠标滚轮旋转（按住SHIFT以更改基准轴），按 %s 更改模式"

  - en_US: "Selected Base Axis (SHIFT+MouseWheel): %d"
    fr_FR: "Axe de base sélectionné (SHIFT+Molette de la souris) : %d"
    es_ES: "Eje base seleccionado (SHIFT+Rueda del ratón) : %d"
    de_DE: "Ausgewählte Basisachse (SHIFT+Mausrad): %d"
    it_IT: "Asse di base selezionato (SHIFT+Rotella del mouse): %d"
    ru_RU: "Выбранная базовая ось (SHIFT+Колесо мыши): %d"
    zh_CN: "选定的基准轴 (SHIFT+鼠标滚轮): %d"

  - en_US: "Selected Rotation (MouseWheel): %d"
    fr_FR: "Rotation sélectionnée (Molette de la souris) : %d"
    es_ES: "Rotación seleccionada (Rueda del ratón) : %d"
    de_DE: "Ausgewählte Rotation (Mausrad): %d"
    it_IT: "Rotazione selezionata (Rotella del mouse): %d"
    ru_RU: "Выбранная ротация (Колесо мыши): %d"
    zh_CN: "选定的旋转 (鼠标滚轮): %d"

  - en_US: "TRANSLATE in X with mousewheel, press %s to change mode"
    fr_FR: "Déplacement en X avec la molette de la souris, appuyez sur %s pour changer de mode"
    es_ES: "TRANSLATE en X con la rueda del ratón, presiona %s para cambiar de modo"
    de_DE: "TRANSLATE in X mit dem Mausrad, drücken Sie %s, um den Modus zu ändern"
    it_IT: "TRANSLATE in X con la rotella del mouse, premi %s per cambiare modalità"
    ru_RU: "TRANSLATE в X с помощью колесика мыши, нажмите %s для изменения режима"
    zh_CN: "使用鼠标滚轮在X轴上翻译，按 %s 更改模式"

  - en_US: "TRANSLATE in Y with mousewheel, press %s to change mode"
    fr_FR: "Déplacement en Y avec la molette de la souris, appuyez sur %s pour changer de mode"
    es_ES: "TRANSLATE en Y con la rueda del ratón, presiona %s para cambiar de modo"
    de_DE: "TRANSLATE in Y mit dem Mausrad, drücken Sie %s, um den Modus zu ändern"
    it_IT: "TRANSLATE in Y con la rotella del mouse, premi %s per cambiare modalità"
    ru_RU: "TRANSLATE в Y с помощью колесика мыши, нажмите %s для изменения режима"
    zh_CN: "使用鼠标滚轮在Y轴上翻译，按 %s 更改模式"

  - en_US: "TRANSLATE in Z with mousewheel, press %s to change mode"
    fr_FR: "Déplacement en Z avec la molette de la souris, appuyez sur %s pour changer de mode"
    es_ES: "TRANSLATE en Z con la rueda del ratón, presiona %s para cambiar de modo"
    de_DE: "TRANSLATE in Z mit dem Mausrad, drücken Sie %s, um den Modus zu ändern"
    it_IT: "TRANSLATE in Z con la rotella del mouse, premi %s per cambiare modalità"
    ru_RU: "TRANSLATE в Z с помощью колесика мыши, нажмите %s для изменения режима"
    zh_CN: "使用鼠标滚轮在Z轴上翻译，按 %s 更改模式"

  - en_US: "Scan\nMode"
    fr_FR: "Scan\nMode"
    es_ES: "Escanear\nModo"
    de_DE: "Scan\nModus"
    it_IT: "Scan\nModalità"
    ru_RU: "Сканировать\nРежим"
    zh_CN: "扫描\n模式"

  - en_US: "To scan a build and save a blueprint of it, aim at it and Hold %s for one second."
    fr_FR: "Pour scanner une construction et enregistrer un plan, visez-la et maintenez %s pendant une seconde."
    es_ES: "Para escanear una construcción y guardar un plano, apúntale y mantén %s durante un segundo."
    de_DE: "Um eine Konstruktion zu scannen und einen Plan davon zu speichern, zielen Sie darauf und halten Sie %s eine Sekunde lang gedrückt."
    it_IT: "Per scansionare una costruzione e salvare un piano, miralo e tieni premuto %s per un secondo."
    ru_RU: "Чтобы отсканировать конструкцию и сохранить план, наведите на нее и удерживайте %s в течение одной секунды."
    zh_CN: "要扫描一个建筑并保存蓝图，请瞄准它并按住 %s 一秒钟。"

  - en_US: "You can then press %s to open the blueprints panel and select the blueprint you want to spawn."
    fr_FR: "Vous pouvez ensuite appuyer sur %s pour ouvrir le panneau des plans et sélectionner le plan que vous souhaitez faire apparaître."
    es_ES: "Luego puedes presionar %s para abrir el panel de planos y seleccionar el plano que deseas generar."
    de_DE: "Sie können dann %s drücken, um das Blueprint-Panel zu öffnen und das Blueprint auszuwählen, das Sie erstellen möchten."
    it_IT: "Puoi quindi premere %s per aprire il pannello dei blueprint e selezionare il blueprint che desideri generare."
    ru_RU: "Вы можете затем нажать %s, чтобы открыть панель чертежей и выбрать чертеж, который хотите создать."
    zh_CN: "您可以按 %s 打开蓝图面板并选择要生成的蓝图。"

  - en_US: "Enter a name for this blueprint"
    fr_FR: "Entrez un nom pour ce plan"
    es_ES: "Introduce un nombre para este plano"
    de_DE: "Geben Sie einen Namen für dieses Blueprint ein"
    it_IT: "Inserisci un nome per questo blueprint"
    ru_RU: "Введите имя для этого чертежа"
    zh_CN: "为此蓝图输入名称"

  - en_US: "Create"
    fr_FR: "Créer"
    es_ES: "Crear"
    de_DE: "Erstellen"
    it_IT: "Crea"
    ru_RU: "Создать"
    zh_CN: "创建"

  - en_US: "Cancel"
    fr_FR: "Annuler"
    es_ES: "Cancelar"
    de_DE: "Abbrechen"
    it_IT: "Annulla"
    ru_RU: "Отмена"
    zh_CN: "取消"

  - en_US: "Confirm"
    fr_FR: "Confirmer"
    es_ES: "Confirmar"
    de_DE: "Bestätigen"
    it_IT: "Conferma"
    ru_RU: "Подтвердить"
    zh_CN: "确认"

  - en_US: "Update"
    fr_FR: "Mettre à jour"
    es_ES: "Actualizar"
    de_DE: "Aktualisieren"
    it_IT: "Aggiorna"
    ru_RU: "Обновить"
    zh_CN: "更新"

  - en_US: "CREATE a new Build:"
    fr_FR: "Créer une nouvelle construction:"
    es_ES: "CREAR una nueva construcción:"
    de_DE: "EINE neue Konstruktion ERSTELLEN:"
    it_IT: "CREA una nuova costruzione:"
    ru_RU: "СОЗДАТЬ новую конструкцию:"
    zh_CN: "创建一个新建筑："

  - en_US: "\tHold %s for one second then release.\n\tA new build will be created with a single 3x3x3 metallic Frame."
    fr_FR: "Maintenez %s pendant une seconde puis relâchez.\n\tUne nouvelle construction sera créée avec un cadre 3x3x3 en métal."
    es_ES: "\tMantén %s durante un segundo y luego suéltalo.\n\tSe creará una nueva construcción con un marco metálico de 3x3x3."
    de_DE: "\tHalten Sie %s eine Sekunde lang gedrückt und lassen Sie es dann los.\n\tEine neue Konstruktion wird mit einem 3x3x3 Metallrahmen erstellt."
    it_IT: "\tTieni premuto %s per un secondo e poi rilascialo.\n\tVerrà creata una nuova costruzione con un telaio metallico 3x3x3."
    ru_RU: "\tУдерживайте %s в течение одной секунды, затем отпустите.\n\tБудет создана новая конструкция с металлическим каркасом 3x3x3."
    zh_CN: "\t按住 %s 一秒钟，然后释放。\n\t将创建一个带有 3x3x3 金属框架的新建筑。"

  - en_US: "ADD a Frame to a build:"
    fr_FR: "AJOUTER un cadre à une construction:"
    es_ES: "AÑADIR un marco a una construcción:"
    de_DE: "EINEN Rahmen zu einer Konstruktion HINZUFÜGEN:"
    it_IT: "AGGIUNGI un telaio a una costruzione:"
    ru_RU: "ДОБАВИТЬ рамку к конструкции:"
    zh_CN: "向建筑添加框架："

  - en_US: "\tAim at an existing frame face then quick press %s."
    fr_FR: "\tVisez une face de cadre existante puis appuyez sur %s."
    es_ES: "\tApunta a una cara de marco existente y presiona %s."
    de_DE: "\tZielen Sie auf eine vorhandene Rahmenfläche und drücken Sie %s."
    it_IT: "\tMirare a una faccia di telaio esistente e premere %s."
    ru_RU: "\tПрицелитесь на существующую грань рамы, затем быстро нажмите %s."
    zh_CN: "\t瞄准现有框架的面，然后快速按 %s。"

  - en_US: "REMOVE a Frame from a build:"
    fr_FR: "SUPPRIMER un cadre d'une construction:"
    es_ES: "ELIMINAR un marco de una construcción:"
    de_DE: "EINEN Rahmen aus einer Konstruktion ENTFERNEN:"
    it_IT: "RIMUOVI un telaio da una costruzione:"
    ru_RU: "УДАЛИТЬ рамку из конструкции:"
    zh_CN: "从建筑中移除框架："

  - en_US: "\tAim at an existing frame face while holding %s then quick press %s."
    fr_FR: "\tVisez une face de cadre existante tout en maintenant %s puis appuyez sur %s."
    es_ES: "\tApunta a una cara de marco existente mientras mantienes %s y luego presiona %s."
    de_DE: "\tZielen Sie auf eine vorhandene Rahmenfläche, während Sie %s halten, und drücken Sie dann %s."
    it_IT: "\tMirare a una faccia di telaio esistente mentre si tiene %s e poi premere %s."
    ru_RU: "\tПрицелитесь на существующую грань рамы, удерживая %s, затем быстро нажмите %s."
    zh_CN: "\t瞄准现有框架的面，同时按住 %s，然后快速按 %s。"

  - en_US: "REMOVE individual Beams:"
    fr_FR: "SUPPRIMER des poutres individuelles:"
    es_ES: "ELIMINAR vigas individuales:"
    de_DE: "EINZELNE Balken ENTFERNEN:"
    it_IT: "RIMUOVI travi individuali:"
    ru_RU: "УДАЛИТЬ отдельные балки:"
    zh_CN: "移除单独的梁："

  - en_US: "\tAim at an existing frame beam while holding SHIFT and %s then quick press %s."
    fr_FR: "\tVisez une poutre de cadre existante tout en maintenant SHIFT et %s puis appuyez sur %s."
    es_ES: "\tApunta a una viga de marco existente mientras mantienes SHIFT y luego presiona %s."
    de_DE: "\tZielen Sie auf einen vorhandenen Rahmenbalken, während Sie SHIFT und %s halten, und drücken Sie dann %s."
    it_IT: "\tMirare a una trave di telaio esistente mentre si tiene SHIFT e poi premere %s."
    ru_RU: "\tПрицелитесь на существующую балку рамы, удерживая SHIFT и %s, затем быстро нажмите %s."
    zh_CN: "\t瞄准现有框架的梁，同时按住 SHIFT 和 %s，然后快速按 %s。"

  - en_US: "ADD back individual Beams:"
    fr_FR: "AJOUTER des poutres individuelles:"
    es_ES: "AÑADIR vigas individuales:"
    de_DE: "EINZELNE Balken WIEDERHINZUFÜGEN:"
    it_IT: "AGGIUNGI travi individuali:"
    ru_RU: "ДОБАВИТЬ отдельные балки:"
    zh_CN: "添加单独的梁："

  - en_US: "\tAim at an existing frame where the beam would be while holding SHIFT then quick press %s."
    fr_FR: "\tVisez un cadre existant où la poutre serait tout en maintenant SHIFT puis appuyez sur %s."
    es_ES: "\tApunta a un marco existente donde estaría la viga mientras mantienes SHIFT y luego presiona %s."
    de_DE: "\tZielen Sie auf einen vorhandenen Rahmen, wo der Balken wäre, während Sie SHIFT halten, und drücken Sie dann %s."
    it_IT: "\tMirare a un telaio esistente dove sarebbe la trave mentre si tiene SHIFT e poi premere %s."
    ru_RU: "\tПрицелитесь на существующий каркас, где была бы балка, удерживая SHIFT, затем быстро нажмите %s."
    zh_CN: "\t瞄准现有框架的梁，同时按住 SHIFT 和 %s，然后快速按 %s。"

  - en_US: "OTHER MODES:"
    fr_FR: "AUTRES MODES:"
    es_ES: "OTROS MODOS:"
    de_DE: "ANDERE MODI:"
    it_IT: "ALTRI MODI:"
    ru_RU: "ДРУГИЕ РЕЖИМЫ:"
    zh_CN: "其他模式："

  - en_US: "%s Blocks"
    fr_FR: "%s Blocs"
    es_ES: "%s Bloques"
    de_DE: "%s Blöcke"
    it_IT: "%s Blocchi"
    ru_RU: "%s Блоки"
    zh_CN: "%s 块"

  - en_US: "ADD a %s to a build:"
    fr_FR: "AJOUTER un %s à une construction:"
    es_ES: "AÑADIR un %s a una construcción:"
    de_DE: "EIN %s zu einer Konstruktion HINZUFÜGEN:"
    it_IT: "AGGIUNGI un %s a una costruzione:"
    ru_RU: "ДОБАВИТЬ %s к конструкции:"
    zh_CN: "向建筑添加 %s："

  - en_US: "\tAim at a frame face then quick press %s."
    fr_FR: "\tVisez une face de cadre puis appuyez sur %s."
    es_ES: "\tApunta a una cara de marco y presiona %s."
    de_DE: "\tZielen Sie auf eine Rahmenfläche und drücken Sie %s."
    it_IT: "\tMirare a una faccia di telaio e premere %s."
    ru_RU: "\tПрицелитесь на грань рамы, затем быстро нажмите %s."
    zh_CN: "\t瞄准框架的面，然后快速按 %s。"

  - en_US: "\tHold SHIFT to use the other logical frame face you're aiming at."
    fr_FR: "\tMaintenez SHIFT pour utiliser l'autre face de cadre logique que vous visez."
    es_ES: "\tMantén SHIFT para usar la otra cara lógica del marco que estás apuntando."
    de_DE: "\tHalten Sie SHIFT, um die andere logische Rahmenfläche zu verwenden, auf die Sie zielen."
    it_IT: "\tTieni premuto SHIFT per utilizzare l'altra faccia logica del telaio su cui stai mirando."
    ru_RU: "\tУдерживайте SHIFT, чтобы использовать другую логическую грань рамы, на которую вы прицеливаетесь."
    zh_CN: "\t按住 SHIFT 以使用您瞄准的框架的其他逻辑面。"

  - en_US: "REMOVE any block or wall from a build:"
    fr_FR: "SUPPRIMER un bloc ou un mur d'une construction:"
    es_ES: "ELIMINAR un bloque o una pared de una construcción:"
    de_DE: "EINEN Block oder eine Wand aus einer Konstruktion ENTFERNEN:"
    it_IT: "RIMUOVI un blocco o una parete da una costruzione:"
    ru_RU: "УДАЛИТЬ блок или стену из конструкции:"
    zh_CN: "从建筑中移除块或墙："

  - en_US: "\tAim at any block or wall while holding %s then quick press %s."
    fr_FR: "\tVisez un bloc ou un mur tout en maintenant %s puis appuyez sur %s."
    es_ES: "\tApunta a un bloque o una pared mientras mantienes %s y luego presiona %s."
    de_DE: "\tZielen Sie auf einen Block oder eine Wand, während Sie %s halten, und drücken Sie dann %s."
    it_IT: "\tMirare a un blocco o una parete mentre si tiene %s e poi premere %s."
    ru_RU: "\tПрицелитесь на блок или стену, удерживая %s, затем быстро нажмите %s."
    zh_CN: "\t瞄准块或墙，同时按住 %s，然后快速按 %s。"

  - en_US: "\tHold %s to configure your tool and move your mouse to select build mode."
    fr_FR: "\tMaintenez %s pour configurer votre outil et déplacez votre souris pour sélectionner le mode de construction."
    es_ES: "\tMantén %s para configurar tu herramienta y mueve el ratón para seleccionar el modo de construcción."
    de_DE: "\tHalten Sie %s, um Ihr Werkzeug zu konfigurieren, und bewegen Sie die Maus, um den Bau-Modus auszuwählen."
    it_IT: "\tTieni premuto %s per configurare il tuo strumento e muovi il mouse per selezionare la modalità di costruzione."
    ru_RU: "\tУдерживайте %s, чтобы настроить инструмент, и перемещайте мышь, чтобы выбрать режим строительства."
    zh_CN: "\t按住 %s 来配置工具，然后移动鼠标以选择构建模式。"

  - en_US: "\tWithin the tool configuration radial menu, use the mouse wheel to select which material to use."
    fr_FR: "\tDans le menu radial de configuration de l'outil, utilisez la molette de la souris pour sélectionner le matériau à utiliser."
    es_ES: "\tDentro del menú radial de configuración de la herramienta, utiliza la rueda del ratón para seleccionar el material a utilizar."
    de_DE: "\tIm radialen Konfigurationsmenü des Werkzeugs verwenden Sie das Mausrad, um das zu verwendende Material auszuwählen."
    it_IT: "\tAll'interno del menu radiale di configurazione dello strumento, utilizza la rotella del mouse per selezionare il materiale da utilizzare."
    ru_RU: "\tВ радиальном меню конфигурации инструмента используйте колесо мыши, чтобы выбрать материал для использования."
    zh_CN: "\t在工具配置的径向菜单中，使用鼠标滚轮选择要使用的材料。"

  - en_US: "\tAim at a block or beam then press %s."
    fr_FR: "\tVisez un bloc ou une poutre puis appuyez sur %s."
    es_ES: "\tApunta a un bloque o una viga y presiona %s."
    de_DE: "\tZielen Sie auf einen Block oder einen Balken und drücken Sie %s."
    it_IT: "\tMirare a un blocco o una trave e premere %s."
    ru_RU: "\tПрицелитесь на блок или балку, затем быстро нажмите %s."
