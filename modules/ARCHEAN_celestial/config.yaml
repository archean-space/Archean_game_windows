  - label: RockRakeTool
    context: crafter
    category: tools
    time: 10
    input:
      ARCHEAN_celestial.Iron: 1000
    output:
      ARCHEAN_celestial.RockRakeTool: 1
  
  - label: NavInstrument
    context: crafter
    category: components
    time: 30
    input:
      ARCHEAN_parts.Circuit: 1
      ARCHEAN_parts.Casing: 9
      ARCHEAN_parts.LED: 100
      ARCHEAN_parts.Magnet: 1
      ARCHEAN_parts.Capacitor: 1
      ARCHEAN_celestial.Gold: 100
      ARCHEAN_parts.Connector: 2
    output:
      ARCHEAN_celestial.NavInstrument: 1
  
  - label: SolarPanel
    context: crafter
    category: components
    time: 10
    input:
      ARCHEAN_parts.Panel: 10
      ARCHEAN_parts.Connector: 3
      ARCHEAN_celestial.Silicon: 15000
    output:
      ARCHEAN_celestial.SolarPanel: 1
  
  - label: SolarSensor
    context: crafter
    category: components
    time: 10
    input:
      ARCHEAN_parts.Casing: 1
      ARCHEAN_parts.Connector: 1
      ARCHEAN_parts.Diode: 10
    output:
      ARCHEAN_celestial.SolarSensor: 1
  
  - label: MiningDrill
    context: crafter
    category: components
    time: 10
    input:
      ARCHEAN_parts.Casing: 380
      ARCHEAN_parts.Screw: 100
      ARCHEAN_parts.Connector: 3
      ARCHEAN_parts.Motor: 2
